name: Docker — Build, Scan & Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, scan and push image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write        # push to GitHub Container Registry
      security-events: write # upload Trivy findings to the Security tab

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Credentials are only needed when we actually publish. Pull requests from
      # forks must not get a token that can write packages.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Build once into the local daemon so the scanner sees the exact image
      # that will be pushed.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: steamdata:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image size
        run: |
          docker image inspect steamdata:ci \
            --format 'Image size: {{.Size}} bytes ({{len .RootFS.Layers}} layers)'
          docker history steamdata:ci --human --format 'table {{.Size}}\t{{.CreatedBy}}'

      # Scanning and gating are separate steps so the findings are always
      # reported, even though a fixable CVE blocks publication.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: steamdata:ci
          format: json
          output: trivy.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Convert scan to SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        env:
          TRIVY_SKIP_DB_UPDATE: "true"
        with:
          image-ref: steamdata:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      # Verify the container really refuses to run as root.
      - name: Assert non-root runtime user
        run: |
          uid=$(docker image inspect steamdata:ci --format '{{.Config.User}}')
          echo "Configured user: '$uid'"
          if [ -z "$uid" ] || [ "$uid" = "0" ] || [ "$uid" = "root" ]; then
            echo "::error::Image would run as root"
            exit 1
          fi

      - name: Smoke test (--help must work)
        run: docker run --rm steamdata:ci --help

      # Runs last so a CVE in the base image does not hide a broken container.
      - name: Enforce vulnerability policy
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys

          report   = json.loads(pathlib.Path('trivy.json').read_text())
          findings = [
              (v.get('Severity', '?'), result.get('Target', '?'), v['VulnerabilityID'],
               v.get('PkgName', '?'), v.get('InstalledVersion', '?'), v.get('FixedVersion', '?'))
              for result in report.get('Results') or []
              for v in result.get('Vulnerabilities') or []
          ]

          rows = '\n'.join(
              f'| {sev} | `{pkg}` | {installed} | {fixed} | {cve} |'
              for sev, _, cve, pkg, installed, fixed in sorted(findings))

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              if not findings:
                  summary.write('## Trivy\n\nNo fixable HIGH or CRITICAL vulnerabilities.\n')
              else:
                  summary.write(
                      f'## Trivy — {len(findings)} fixable finding(s)\n\n'
                      '| Severity | Package | Installed | Fixed in | CVE |\n'
                      '|---|---|---|---|---|\n' + rows + '\n')

          for sev, target, cve, pkg, installed, fixed in sorted(findings):
              print(f'::error::{sev} {cve} in {pkg} {installed} '
                    f'(fixed in {fixed}) — {target}')

          if findings:
              sys.exit(f'{len(findings)} fixable HIGH/CRITICAL vulnerabilities; not publishing')
          print('No fixable HIGH or CRITICAL vulnerabilities.')
          PY

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: true
          sbom: true
