name: Docker — Build, Scan & Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, scan and push image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write        # push to GitHub Container Registry
      security-events: write # upload Trivy findings to the Security tab

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Credentials are only needed when we actually publish. Pull requests from
      # forks must not get a token that can write packages.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Build once into the local daemon so the scanner sees the exact image
      # that will be pushed.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: steamdata:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image size
        run: |
          docker image inspect steamdata:ci \
            --format 'Image size: {{.Size}} bytes ({{len .RootFS.Layers}} layers)'
          docker history steamdata:ci --human --format 'table {{.Size}}\t{{.CreatedBy}}'

      # Fails the build on known HIGH/CRITICAL CVEs so a vulnerable image is
      # never published.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: steamdata:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      # Verify the container really refuses to run as root.
      - name: Assert non-root runtime user
        run: |
          uid=$(docker image inspect steamdata:ci --format '{{.Config.User}}')
          echo "Configured user: '$uid'"
          if [ -z "$uid" ] || [ "$uid" = "0" ] || [ "$uid" = "root" ]; then
            echo "::error::Image would run as root"
            exit 1
          fi

      - name: Smoke test (--help must work)
        run: docker run --rm steamdata:ci --help

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: true
          sbom: true
