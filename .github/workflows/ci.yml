name: CI — Build & Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore "Steam data puller/Steam data puller.slnx"

      - name: Build
        run: dotnet build "Steam data puller/Steam data puller.slnx" --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test "Steam data puller/Steam data puller.slnx"
          --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          --logger "trx;LogFileName=results.trx"

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: TestResults/**/*.trx

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: coverage-report
          reporttypes: Html;TextSummary

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 14

      - name: Check branch coverage ≥ 60%
        run: |
          python3 -c "
          import re, sys
          try:
              text = open('coverage-report/Summary.txt').read()
          except FileNotFoundError:
              print('Summary.txt not found — skipping coverage gate')
              sys.exit(0)
          m = re.search(r'Branch coverage:\s*([\d.]+)%', text)
          if not m:
              print('Could not parse branch coverage — skipping')
              sys.exit(0)
          val = float(m.group(1))
          print(f'Branch coverage: {val}%')
          if val < 60:
              print(f'FAIL: required >= 60%, got {val}%')
              sys.exit(1)
          print('OK')
          "
