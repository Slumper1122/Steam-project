name: CI — Build & Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write         # publish-unit-test-result-action creates a check run
      pull-requests: write  # ...and comments the summary on the PR

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore "Steam data puller/Steam data puller.slnx"

      - name: Build
        run: dotnet build "Steam data puller/Steam data puller.slnx" --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test "Steam data puller/Steam data puller.slnx"
          --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          --logger "trx;LogFileName=results.trx"

      # Reporting only. A problem here must never mask the coverage gate below,
      # which is the step that actually blocks a merge.
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        continue-on-error: true
        with:
          files: TestResults/**/*.trx

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: coverage-report
          reporttypes: Html;TextSummary

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 14

      # A gate that skips itself when something is missing is not a gate, so an
      # unreadable report fails the build just like insufficient coverage does.
      - name: Check branch coverage ≥ 60%
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          summary = Path('coverage-report/Summary.txt')
          if not summary.exists():
              sys.exit('::error::Summary.txt missing — coverage could not be verified')

          match = re.search(r'Branch coverage:\s*([\d.]+)%', summary.read_text())
          if not match:
              sys.exit('::error::No branch coverage line in Summary.txt')

          actual = float(match.group(1))
          print(f'Branch coverage: {actual}% (required: 60%)')
          if actual < 60:
              sys.exit(f'::error::Branch coverage {actual}% is below the 60% minimum')
          PY
