name: Collect Steam Data (hourly)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  collect:
    name: Pull & store Steam snapshots
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore & Build (Release)
        run: |
          dotnet restore "Steam data puller/Steam data puller.slnx"
          dotnet build   "Steam data puller/Steam data puller.slnx" \
            --no-restore --configuration Release

      - name: Collect data
        run: >
          dotnet run
          --project "Steam data puller/Steam data puller/Steam data puller.csproj"
          --no-build --configuration Release
          -- collect
          --watchlist watchlist.json
          --output data
        env:
          STEAM_API_KEY:  ${{ secrets.STEAM_API_KEY }}
          SUPABASE_URL:   ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:   ${{ secrets.SUPABASE_KEY }}

      - name: Upload local snapshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots-${{ github.run_id }}
          path: data/
          retention-days: 30
          if-no-files-found: ignore
